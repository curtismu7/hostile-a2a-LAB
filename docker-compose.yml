# OrbStack:  HOST_PORT=4750 docker compose up --build -d   ->  http://127.0.0.1:4750
# The server binds 0.0.0.0 INSIDE the container (HOSTILE_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below: this server serves hostile payloads.
name: hostile-a2a

services:
  hostile-a2a:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-4750}:4750"
    environment:
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      PORT: "4750"
      HOSTILE_BIND: 0.0.0.0
      # Extra Host names the demo API answers besides loopback; every other Host is refused. The default is the name the
      # family lab-proxy (https://local.ping-devops.com:8443/hostile-a2a/) sends in Host.
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-hostile-a2a.local.ping-devops.com}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4750/api/health').then(r=>r.json()).then(j=>process.exit(j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
