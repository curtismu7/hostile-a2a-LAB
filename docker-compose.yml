# OrbStack:  HOST_PORT=4901 docker compose up --build -d   ->  http://127.0.0.1:4901
# The server binds 0.0.0.0 INSIDE the container (HOSTILE_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below: this server serves hostile payloads.
name: hostile-a2a

services:
  hostile-a2a:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-4901}:4901"
    environment:
      PORT: "4901"
      HOSTILE_BIND: 0.0.0.0
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4901/api/health').then(r=>r.json()).then(j=>process.exit(j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
